<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clearcast</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1017;
        --panel: #131a24;
        --panel-strong: #182233;
        --accent: #41d4ff;
        --accent-strong: #7ff2ff;
        --text: #f4f7ff;
        --muted: #b7c0d6;
        --border: #243247;
        --shadow: rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Noto Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #162235, var(--bg));
        color: var(--text);
        min-height: 100vh;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 24px;
        display: grid;
        gap: 24px;
      }

      header h1 {
        margin: 0;
        font-size: 2.25rem;
        letter-spacing: 0.02em;
      }

      header p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .card {
        background: linear-gradient(160deg, var(--panel), var(--panel-strong));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 18px 40px var(--shadow);
        width: 100%;
        max-width: 100vw;
      }

      .current {
        display: grid;
        gap: 12px;
      }

      .current-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      .current-location {
        font-size: 2.1rem;
        color: var(--muted);
      }

      .current-temp {
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--accent-strong);
      }

      .current-condition {
        font-size: 1.1rem;
        margin-bottom: 16px;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        color: var(--muted);
      }

      .meta span {
        display: block;
        font-size: 0.95rem;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(65, 212, 255, 0.35);
        color: var(--accent);
        font-size: 0.85rem;
        letter-spacing: 0.02em;
      }

      .current-icon {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 8px 0;
      }

      .current-icon img {
        width: 112px;
        height: 112px;
        object-fit: contain;
        image-rendering: auto;
      }

      .hourly-icons {
        display: flex;
        justify-content: center;
        align-items: stretch;
        width: 100%;
        padding: 0;
        margin: 0 0 16px;
        gap: 0;
      }

      .hourly-icon {
        flex: 1 1 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        line-height: 0;
        height: 56px;
      }

      .hourly-icon img {
        height: 100%;
        width: 100%;
        max-width: 100%;
        object-fit: cover;
        margin: 0;
        padding: 0;
        display: block;
        border: 2px solid #000;
        box-sizing: border-box;
      }

      #hourly-chart {
        border: 1px solid var(--border);
        border-radius: 12px;
      }
    </style>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Clearcast</h1>
        <p>Welcome to the jungle</p>
      </header>

      <section class="card current" th:replace="~{fragments/current :: currentCard(${current})}"></section>
      <section class="card" th:replace="~{fragments/hourly :: hourlyCard(${hourly})}"></section>
    </main>
    <script th:inline="javascript">
      const hourlyTimes = /*[[${hourlyTimes}]]*/ [];
      const hourlyTemps = /*[[${hourlyTemps}]]*/ [];
      const hourlyPrecip = /*[[${hourlyPrecip}]]*/ [];
      const yMin = [[${hourlyYMin}]];
      const yMax = [[${hourlyYMax}]];
      const tickStep = Math.max(1, Math.ceil(hourlyTimes.length / 8));
      const tickVals = hourlyTimes.filter((_, i) => i % tickStep === 0);

      const tempTrace = {
        x: hourlyTimes,
        y: hourlyTemps,
        mode: "lines+markers",
        name: "Temp (°F)",
        line: { color: "#f07a8c", width: 3 },
        marker: { color: "#f07a8c", size: 6 },
      };

      const precipTrace = {
        x: hourlyTimes,
        y: hourlyPrecip,
        mode: "lines+markers",
        name: "Precip (%)",
        yaxis: "y2",
        line: { color: "#41d4ff", width: 2, dash: "dot" },
        marker: { color: "#41d4ff", size: 5 },
      };

      const layout = {
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        margin: { t: 20, r: 40, b: 40, l: 40 },
        xaxis: {
          title: "Time",
          tickfont: { color: "#b7c0d6" },
          gridcolor: "#243247",
          tickangle: 0,
          tickmode: "array",
          tickvals: tickVals,
          ticktext: tickVals,
        },
        yaxis: { title: "Temp (°F)", range: [yMin, yMax], tickfont: { color: "#b7c0d6" }, gridcolor: "#243247" },
        yaxis2: {
          title: "Precip (%)",
          range: [0, 100],
          overlaying: "y",
          side: "right",
          tickfont: { color: "#b7c0d6" },
          gridcolor: "rgba(0,0,0,0)",
        },
        legend: { font: { color: "#b7c0d6" } },
      };

      Plotly.newPlot("hourly-chart", [tempTrace, precipTrace], layout, { displayModeBar: false });
    </script>
  </body>
</html>
